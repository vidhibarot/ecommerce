<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coir Craft Commerce - Login Info</title>
    <style>
      body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .title {
        font-size: 20px;
        color: #333;
        margin-bottom: 15px;
      }

      .password {
        font-size: 24px;
        color: #000;
        font-weight: bold;
        background: #f0f0f0;
        padding: 12px 20px;
        border-radius: 5px;
        display: inline-block;
        margin: 10px 0;
      }

      .note {
        font-size: 12px;
        color: #666;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">Your Login Password</div>
      <div class="password">{{password}}</div>
      <div class="note">Please keep this password safe and confidential.</div>
    </div>
  </body>
</html>
